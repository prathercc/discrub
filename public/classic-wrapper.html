<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discrub Classic</title>
  <link rel="stylesheet" href="classic-wrapper.css" />
</head>
<body>
  <!-- Loading overlay while Classic boots -->
  <div id="loading" class="loading-overlay">
    <div class="loading-spinner"></div>
    <span class="loading-text">Loading Discrub Classic...</span>
  </div>

  <!-- Classic app iframe -->
  <iframe id="classic-iframe" allow="storage-access *; clipboard-write *"></iframe>

  <script src="classic-wrapper.js"></script>
</body>
</html>
